# Verification only: no deployment step in this file. Runs on GitHub-hosted
# `ubuntu-24.04` only (this repo is public: a fork PR must never run code on
# the org's own infrastructure). Toolchain: `.github/actions/setup`.
#
# Walks every commit reachable from HEAD, so it needs full history. On
# pull_request GitHub checks out a synthetic merge commit that would fail this
# very check; lint the PR's real head instead.
name: lint-history

on:
  push:
    branches: [development, production]
  pull_request:

permissions:
  contents: read

jobs:
  lint-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: npm run check:history
