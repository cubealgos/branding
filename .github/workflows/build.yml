# Verification only: no deployment step in this file. Runs on GitHub-hosted
# `ubuntu-24.04` only (this repo is public: a fork PR must never run code on
# the org's own infrastructure). Toolchain: `.github/actions/setup`.
name: build

on:
  push:
    branches: [development, production]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Fail if the committed dist/ is stale
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            git diff -- dist
            echo "::error::dist/ is stale: run npm run build and commit the result"
            exit 1
          fi
      - run: npm run check:fresh
      - run: npm run check:fish-motion
