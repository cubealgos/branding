<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -6 144 90" role="img" aria-label="Confused clownfish" class="fish fish--confused">
  <title>Confused clownfish</title>
  <style>
    .fish { overflow: visible; }
    .fish .mover, .fish .bodyg, .fish .tail, .fish .look, .fish .q, .fish .z1, .fish .z2, .fish .tear { transform-box: view-box; }
    .fish .bodyg { transform-origin: 72px 40px; }
    .fish .tail { transform-origin: 60px 40px; }
    .fish--confused .bodyg { transform: rotate(-8deg); }
    @media (prefers-reduced-motion: no-preference) {
      .fish--confused .bodyg { animation-name: fish-confused-bodyg; animation-duration: calc(var(--duration-wipe, 1000ms) * 3.2); animation-timing-function: var(--ease-draw, cubic-bezier(.65,0,.35,1)); animation-iteration-count: infinite; animation-fill-mode: both; }
      .fish--confused .q { animation-name: fish-confused-q; animation-duration: calc(var(--duration-wipe, 1000ms) * 1.6); animation-timing-function: var(--ease-draw, cubic-bezier(.65,0,.35,1)); animation-iteration-count: infinite; animation-fill-mode: both; }
    }
    @keyframes fish-confused-bodyg { 0% { transform: rotate(-6deg); } 50% { transform: rotate(-11deg); } 100% { transform: rotate(-6deg); } }
    @keyframes fish-confused-q { 0% { transform: translate(0px, 0px); } 50% { transform: translate(0px, -3px); } 100% { transform: translate(0px, 0px); } }
  </style>
  <defs><clipPath id="fish-clip"><path d="M54 8 H90 L110 28 V52 L90 72 H54 L36 54 V26 Z"/><path d="M60 40 L14 14 L27 40 L14 66 Z"/></clipPath></defs>
  <g class="mover">
    <g class="bodyg" transform="rotate(-8 72 40)"><path class="tail" fill="#FBFBFC" d="M60 40 L14 14 L27 40 L14 66 Z"/><path class="body" fill="#FBFBFC" d="M54 8 H90 L110 28 V52 L90 72 H54 L36 54 V26 Z"/><rect class="band" x="60" y="8" width="12" height="64" fill="#E7CEB0" clip-path="url(#fish-clip)"/><rect x="81" y="22" width="7" height="17" fill="#16181D"/><rect x="95" y="31" width="7" height="8" fill="#16181D"/></g>
    <path class="q" d="M118 2 H130 V14 H124 V20 H118 V12 H124 V8 H118 Z M118 24 H124 V30 H118 Z" style="fill:var(--fish-extra,#16181D)"/>
  </g>
</svg>
